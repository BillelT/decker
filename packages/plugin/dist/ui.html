:root {
  --color-orange: #f06800;
  --color-orange-20: rgba(240, 104, 0, 0.2);
  --color-orange-40: rgba(240, 104, 0, 0.4);
  --color-orange-red: #f04000;
  /* Rouge PLEIN réservé aux états d'erreur/bloquants — distinct de
     --color-orange-red, qui marque la sélection active : les deux étaient
     identiques et une vignette bloquante était indiscernable d'une vignette
     sélectionnée (audit template). */
  --color-error: #e00000;
  --color-bg: #fff9f5;
  --color-text: #120f0d;
  --color-black-70: rgba(18, 15, 13, 0.7);
  --color-scrollbar: #cccccc;
  --color-gray-light: #eeeeee;
  --color-border: var(--color-gray-light);
  /* Surfaces additionnelles pour le layout à deux colonnes — même famille
     que le monogramme (#F2ECE8) plutôt que des gris neutres génériques. */
  --color-surface: #ffffff;
  --color-surface-muted: #f2ece8;
}

/* Thème sombre : Figma pose `figma-dark`/`figma-light` sur <html> quand le
   plugin est ouvert avec `themeColors: true` (code.ts) — palette claire
   inversée, l'orange de marque reste identique. Le fallback
   prefers-color-scheme couvre le rendu hors Figma (dev navigateur), sans
   jamais contredire une classe posée par Figma.

   `f2s-theme-light`/`f2s-theme-dark` sont le choix EXPLICITE fait dans la
   modale de réglages (ui/theme.ts) : il l'emporte sur le thème de Figma comme
   sur la préférence système, d'où les `:not(.f2s-theme-light)` ci-dessous. */
html.figma-dark:not(.f2s-theme-light),
html.f2s-theme-dark {
  --color-bg: #171310;
  --color-text: #f2ece8;
  --color-black-70: rgba(242, 236, 232, 0.7);
  --color-scrollbar: #4d453e;
  --color-border: #332c26;
  --color-surface: #211c17;
  --color-surface-muted: #2a231d;
  /* Non redéfini jusqu'ici : .f2s-log-entry (background: var(--color-gray-light))
     restait un gris clair fixe même en thème sombre — illisible et
     incohérent posé sur --color-bg (audit). Même teinte que --color-border
     ci-dessus : c'est déjà l'équivalent sombre établi de ce gris clair
     (--color-border = var(--color-gray-light) en thème clair, cf. :root). */
  --color-gray-light: #332c26;
}

@media (prefers-color-scheme: dark) {
  html:not(.figma-light):not(.f2s-theme-light) {
    --color-bg: #171310;
    --color-text: #f2ece8;
    --color-black-70: rgba(242, 236, 232, 0.7);
    --color-scrollbar: #4d453e;
    --color-border: #332c26;
    --color-surface: #211c17;
    --color-surface-muted: #2a231d;
    --color-gray-light: #332c26;
  }
}

* {
  box-sizing: border-box;
}

::selection {
  background: var(--color-orange-20);
}

html,
body {
  height: 100%;
  margin: 0;
}

body {
  font-family: 'Cabinet Grotesk', system-ui, sans-serif;
  font-size: 12px;
  font-weight: 400;
  color: var(--color-text);
  background: var(--color-bg);
}

#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  padding-bottom: 57px;
}

button {
  font-family: inherit;
  cursor: pointer;
}

button:disabled {
  cursor: default;
  opacity: 0.5;
}

a {
  color: var(--color-orange);
}

/* Scrollbar (WebKit) — flèches/piste/poignée en #CCCCCC (spec DS). 6px
   (au lieu de 10px) pour que toutes les scrollbars restent fines, en
   cohérence avec scrollbar-width: thin ci-dessous pour Firefox — sauf en
   win95 (styles.win95.css), qui garde volontairement l'ascenseur
   16px/motif tramé d'origine. */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--color-scrollbar);
  border-radius: 8px;
}
::-webkit-scrollbar-button {
  background: var(--color-scrollbar);
  height: 6px;
  width: 6px;
}
* {
  scrollbar-color: var(--color-scrollbar) transparent;
  scrollbar-width: thin;
}

/* ---- Top bar ---- */

/* Le champ nom (.f2s-title-input) a une largeur FIXE : ni lui ni ses
   ancêtres (.f2s-topbar-left, .f2s-topbar-title-group) ne sont plus
   compressibles (flex: none partout), pour que sa taille ne varie plus
   selon la longueur du libellé des boutons d'action ("Select frames to
   add" vs "Add selection", "Export" vs "Create template", spinner
   "Waiting…"…) ni selon le mode deck/template. Le header doit rester sur
   une seule ligne dans tous les cas, sans chevauchement ni scroll : pas
   de flex-wrap, et chaque libellé de bouton (y compris celui du flow de
   connexion Google) reste assez court pour que les deux groupes tiennent
   toujours ensemble dans les 960px du panneau (largeur fixe, non
   redimensionnable — voir figma.showUI dans code.ts). */
.f2s-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: nowrap;
  gap: 16px;
  padding: 16px 16px 0;
  flex: none;
}

.f2s-topbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
  flex: none;
}

.f2s-topbar-title-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
}

.f2s-topbar-actions {
  display: flex;
  align-items: center;
  gap: 16px;
  flex: none;
}

.f2s-logo {
  width: 24px;
  height: 24px;
  flex: none;
  border-radius: 8px;
  display: block;
}

.f2s-logo svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* ---- Toolbar (polices) ---- */

.f2s-toolbar {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 12px 16px;
  flex: none;
}

.f2s-toolbar-row {
  display: flex;
  /* Le nom du deck et la liste de polices restent sur une seule ligne : si
     la liste de polices est trop longue pour tenir, la ligne défile
     horizontalement plutôt que de retomber le nom du deck dessous. */
  flex-wrap: nowrap;
  gap: 24px;
  overflow-x: auto;
  padding-bottom: 2px;
}

.f2s-toolbar-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
  flex-wrap: nowrap;
}

.f2s-toolbar-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--color-black-70);
  white-space: nowrap;
}

.f2s-toolbar-muted {
  font-size: 12px;
  color: var(--color-black-70);
}

.f2s-dim-box {
  font-size: 12px;
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  border-radius: 6px;
  padding: 2px 10px;
  min-width: 24px;
  text-align: center;
}

.f2s-dim-sep {
  color: var(--color-black-70);
}

.f2s-dim-unit {
  font-size: 11px;
  color: var(--color-black-70);
}

/* Champ de nommage du deck/template (topbar) — largeur fixe (voir le
   commentaire sur .f2s-topbar) : ne se redimensionne plus jamais selon
   l'état des boutons d'action ou le mode deck/template. */
.f2s-title-input {
  font-family: inherit;
  font-size: 12px;
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text);
  border-radius: 4px;
  padding: 3px 8px;
  flex: none;
  width: 170px;
}

.f2s-title-input:focus {
  outline: none;
  border-color: var(--color-orange-40);
}

.f2s-title-input::placeholder {
  color: var(--color-black-70);
  opacity: 0.7;
}

.f2s-font-select {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  white-space: nowrap;
}

.f2s-font-original {
  color: var(--color-black-70);
}

.f2s-font-arrow {
  color: var(--color-black-70);
}

.f2s-font-dropdown {
  font-family: inherit;
  font-size: 12px;
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text);
  border-radius: 4px;
  padding: 3px 8px;
}

.f2s-font-dropdown:focus {
  outline: none;
  border-color: var(--color-orange-40);
}

/* ---- Buttons ---- */

.f2s-btn {
  font-size: 13px;
  font-weight: 700;
  border-radius: 8px;
  padding: 8px 16px;
  border: 1px solid transparent;
  white-space: nowrap;
  text-decoration: none;
  transition: background-color 0.15s ease, color 0.15s ease, outline-color 0.15s ease, transform 0.15s ease;
}

/* Transform translateY() uniquement en mode moderne/hybrid (Win95 gère le pressed via box-shadow) */
html:not(.f2s-skin--win95) .f2s-btn:active:not(:disabled) {
  transform: translateY(0.5px);
}

/* Contour seul au repos (le noir plein pesait visuellement plus lourd que le
   bouton primaire orange — hiérarchie inversée, cf. audit) ; le fond
   n'apparaît qu'au hover. */
.f2s-btn--tertiary {
  background: transparent;
  color: var(--color-text);
  border-color: var(--color-text);
}

.f2s-btn--tertiary:hover:not(:disabled) {
  background: var(--color-text);
  color: var(--color-bg);
}

.f2s-btn--secondary {
  background: transparent;
  border-color: var(--color-orange);
  color: var(--color-orange);
  display: inline-flex;
  align-items: center;
  outline: 1px solid transparent;
  outline-offset: -2px;
}

.f2s-btn--secondary:hover:not(:disabled) {
  background: var(--color-orange);
  color: var(--color-bg);
  outline-color: var(--color-orange);
}

.f2s-btn--primary {
  background: var(--color-orange);
  color: var(--color-bg);
}

.f2s-btn--primary:hover:not(:disabled) {
  background: var(--color-orange-red);
}

/* ---- Body : rail de miniatures + canvas ---- */

.f2s-body {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: stretch;
  border-top: 1px solid var(--color-border);
}

/* ---- Toast temporaire ----
   Pour les messages sans place dédiée dans le layout (ex. notices de
   sélection du mode deck) : un overlay auto-dismiss (délai piloté par
   ui.tsx) plutôt qu'un texte inline qui pousserait le contenu autour de lui. */

.f2s-toast {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  max-width: calc(100% - 32px);
  padding: 8px 14px;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: 8px;
  box-shadow: 0 8px 20px rgba(18, 15, 13, 0.18);
  color: var(--color-error);
  font-size: 12px;
  font-weight: 600;
  text-align: center;
  pointer-events: none;
  animation: f2s-toast-in 160ms var(--f2s-modal-ease);
}

@keyframes f2s-toast-in {
  from {
    opacity: 0;
    transform: translate(-50%, -6px);
  }
  to {
    opacity: 1;
    transform: translate(-50%, 0);
  }
}

@media (prefers-reduced-motion: reduce) {
  .f2s-toast {
    animation-duration: 0.01ms;
  }
}

.f2s-sidebar {
  flex: none;
  width: 190px;
  overflow-y: auto;
  /* Réserve la place de la scrollbar même quand le contenu ne déborde pas
     encore : sans ça, les vignettes gagnent/perdent quelques px de large
     pile au moment où une frame de plus fait apparaître l'ascenseur. */
  scrollbar-gutter: stable;
  padding: 8px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  border-right: 1px solid var(--color-border);
}

.f2s-sidebar-item {
  /* Décalage "fantôme" pendant un drag (voir ui.tsx) : anime le retour à un
     cran entier plutôt qu'un saut instantané. La vignette activement
     déplacée désactive cette transition (elle doit suivre le curseur au
     pixel près, sans lag). */
  transition: transform 180ms ease;
}

/* Aside droit du mode template (TemplatePanel + TemplateStylePanel) :
   couleurs/typo du template toujours visibles à côté du rail de layouts,
   plutôt que dans un onglet séparé — évite le va-et-vient et laisse la
   topbar assez étroite pour ne jamais dépasser la largeur du plugin. */
.f2s-style-aside {
  flex: none;
  width: 280px;
  overflow-y: auto;
  scrollbar-gutter: stable;
  padding: 16px;
  border-left: 1px solid var(--color-border);
}

.f2s-empty {
  color: var(--color-black-70);
  font-size: 14px;
  font-weight: 500;
  padding: 24px 0;
  text-align: center;
}

.f2s-frame-info {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 8px;
}

.f2s-frame-text {
  font-size: 12px;
  color: var(--color-black-70);
}

.f2s-frame-index {
  font-size: 12px;
  color: var(--color-black-70);
  flex: none;
}

/* Nom de la vignette (mode template) : visuellement du texte au repos, se
   révèle comme un champ éditable au survol de `.f2s-frame-info` ou au focus
   — le libellé se tronque avec ellipsis plutôt que de pousser l'index ou le
   bouton de suppression hors de leur place. */
.f2s-frame-name-input {
  flex: 1;
  min-width: 0;
  font: inherit;
  font-size: 12px;
  color: var(--color-black-70);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 2px 4px;
  margin: -2px -4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: text;
  transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}

.f2s-frame-info:hover .f2s-frame-name-input,
.f2s-frame-name-input:focus {
  background: var(--color-surface);
  border-color: var(--color-border);
  color: var(--color-text);
  outline: none;
}

.f2s-frame-controls {
  display: flex;
  gap: 4px;
  flex: none;
}

.f2s-icon-btn {
  border: none;
  background: transparent;
  border-radius: 4px;
  width: 22px;
  height: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--color-text);
}

.f2s-icon-btn:hover:not(:disabled) {
  background: var(--color-orange-40);
}

.f2s-frame-preview {
  border-radius: 8px;
  border: 2px solid transparent;
  background: var(--color-surface-muted);
  aspect-ratio: 16 / 9;
  width: 100%;
  display: block;
  overflow: hidden;
  cursor: pointer;
  padding: 0;
  touch-action: none;
}

/* Retour hover = sélection (pas le drag, qui reste discret tant qu'aucun
   mouvement n'est détecté — voir .is-dragging plus bas). */
.f2s-frame-preview:hover:not(.is-active) {
  border-color: var(--color-scrollbar);
}

.f2s-frame-preview.is-active {
  border-color: var(--color-orange-red);
}

.f2s-frame-preview img {
  width: 100%;
  height: 100%;
  /* `contain` plutôt que `cover` : les slots restent tous au même format
     16:9 (rail cohérent), mais une frame portrait/carrée est montrée en
     entier sur le fond de surface au lieu d'être tronquée par un cadrage
     qui ne correspond ni à la frame ni au rendu Slides. */
  object-fit: contain;
  display: block;
  pointer-events: none;
}

/* Drag au pointeur (voir ui.tsx) : la vignette suit le curseur via
   `transform`, sans ombre ni ghost natif — suivi immédiat, donc pas de
   transition sur cette vignette précise (seules les autres, décalées pour
   ouvrir la place, en gardent une). */
.f2s-sidebar-item.is-dragging {
  position: relative;
  z-index: 10;
  transition: none;
}

/* Relâchement du drag : `order` se réorganise et les transforms de
   drag/ghost repassent à zéro dans le même rendu (voir ui.tsx) — sans
   ceci, la transition animerait ce retour à zéro par-dessus une position
   de flux déjà réorganisée, ce qui fait déraper la vignette d'un cran
   avant qu'elle ne revienne à sa place. */
.f2s-sidebar-item.is-releasing {
  transition: none;
}

.f2s-sidebar-item.is-dragging .f2s-frame-preview {
  cursor: grabbing;
}

/* ---- Canvas principal ---- */

.f2s-canvas {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  /* `safe center` : centre le contenu quand il tient dans le panneau, mais
     revient à un alignement de départ dès qu'il déborde — sinon un
     `justify-content: center` classique sur un conteneur scrollable rogne le
     bord de tête du contenu hors de portée du scroll (on ne peut jamais
     remonter jusqu'au haut réel de la preview). */
  justify-content: safe center;
  gap: 24px;
}

.f2s-canvas-empty {
  color: var(--color-black-70);
  font-size: 12px;
  text-align: center;
}

.f2s-canvas-preview {
  max-width: 640px;
  /* Moins que 100% : sur une frame haute, la preview seule remplissait tout
     le canvas visible et les Dimensions/Logs disparaissaient entièrement
     sous le pli, sans le moindre indice qu'il y avait plus à voir en
     scrollant. Un plafond plus bas garantit qu'un aperçu du bloc Logs reste
     toujours visible (audit) — .f2s-canvas reste scrollable pour le reste. */
  max-height: 65%;
  flex: none;
  border: 1px solid var(--color-scrollbar);
}

.f2s-canvas-preview img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
}

/* ---- Logs (rapport de fidélité) : sous la preview + dimensions du deck ----
   Les données (nativeCount/rasterCount/warnings) arrivent déjà avec
   `candidate-added`/`candidate-updated` (code.ts) mais étaient ignorées côté
   UI (TODO.md) — même wording et même geste "cliquer pour sélectionner le
   nœud source" que le rapport de template. */

.f2s-logs {
  width: 100%;
  max-width: 640px;
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  border-radius: 8px;
  padding: 12px 16px;
}

.f2s-logs-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.f2s-log-entry {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  font-family: inherit;
  font-size: 12px;
  color: var(--color-text);
  background: var(--color-gray-light);
  border: 1px solid var(--color-border);
  border-radius: 6px;
  padding: 6px 10px;
}

.f2s-log-entry:hover {
  border-color: var(--color-orange);
}

/* Mode template uniquement (TemplatePanel.tsx) : `.f2s-log-entry` y est un
   `<li>` plutôt qu'un `<button>` (le deck garde le bouton simple), pour
   pouvoir loger un `<select>` de rôle de placeholder à côté de la zone
   cliquable — un `<select>` posé DANS un `<button>` serait du HTML
   invalide et son clic serait intercepté par le bouton englobant. */
.f2s-log-entry-clickarea {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1 1 auto;
  min-width: 0;
  text-align: left;
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
}

/* Sélecteur de rôle de placeholder (audit — associer un contenu à
   [[title]]/[[body]]/[[image]]… directement depuis le rapport, sans
   renommer le calque à la main dans Figma). Volontairement discret : ce
   n'est pas le repère principal de la ligne, juste une action disponible. */
.f2s-log-entry-role {
  flex: none;
  font-size: 10px;
  font-family: inherit;
  color: var(--color-black-70);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: 4px;
  padding: 2px 4px;
  max-width: 110px;
}

/* Une seule ligne, tronquée : voir le commentaire sur `f2s-log-entry-text`
   dans DeckPanel.tsx — un nom de calque texte peut être un paragraphe
   entier, seul compte de pouvoir identifier l'élément et cliquer dessus.
   Le message (ce qui a été fait) est prioritaire : c'est le nom du calque
   qui cède la place et se tronque en premier. */
.f2s-log-entry-text {
  display: flex;
  align-items: baseline;
  gap: 4px;
  flex: 1;
  min-width: 0;
}

.f2s-log-entry-name {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.f2s-log-entry-message {
  flex: 0 1 auto;
  max-width: 60%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Seuls les éléments RASTERISÉS (perte d'édition native) méritent une
   bordure rouge qui attire l'œil sur toute la liste — un warning "blocking"
   (mode template) ou "Approximated" (police substituée, radius
   approximé…) reste un élément natif éditable, la bordure colorée serait
   trompeuse à côté d'un vrai raster (audit). */
.f2s-log-entry--blocking {
  color: var(--color-error);
}

.f2s-log-entry--rasterized {
  border-color: var(--color-error);
}

/* Contient désormais la raison précise ("Font "Zodiak" → "Inter"",
   "Gradients are not supported by Slides"…) plutôt qu'un mot générique —
   sans majuscules (qui rendrait les noms de police entre guillemets
   illisibles). Posé à droite, sans rétrécir (`flex: 0 0 auto`) : c'est le
   nom du calque (`.f2s-log-entry-name`, à gauche) qui cède toujours la
   place et se tronque en premier — `max-width`+ellipsis ne sert qu'en
   filet de sécurité si le tag seul dépasse déjà la largeur de la ligne. */
.f2s-log-entry-flag {
  flex: 0 0 auto;
  min-width: 0;
  max-width: 70%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.01em;
  padding: 2px 6px;
  border-radius: 4px;
  color: #fff;
}

.f2s-log-entry-flag--rasterized {
  background: var(--color-error);
}

/* Repère plus discret que "Rasterized" : l'élément reste natif et éditable,
   juste pas garanti identique au pixel près — un aplat orange plein
   pèserait visuellement autant qu'un vrai raster. Même teinte de marque,
   posée en tapis clair (opacité) plutôt qu'en plein — texte blanc comme
   "Rasterized" (orange sur orange-40 était illisible, faute de contraste). */
.f2s-log-entry-flag--visual-diff {
  background: var(--color-orange-40);
}

/* ---- Création de template : rapport de contenu communicable ----
   (brief-creation-template-google-slides.md — couleurs, typos, layouts,
   placeholders). Même rail de vignettes + zone principale que le deck. Les
   couleurs/typo AGRÉGÉES de tout le template vivent désormais dans l'aside
   "Styles" (TemplateStylePanel) : un rapport par layout, redondant, n'a
   plus sa place ici — la zone principale empile donc la preview (pleine
   largeur, juste les 24px de padding de `.f2s-canvas`) puis les infos
   propres à CE layout (placeholders, erreurs, contenu) — le contenu peut
   dépasser la hauteur visible, d'où l'alignement en haut plutôt que centré
   verticalement. */

.f2s-canvas--template {
  justify-content: flex-start;
  align-items: stretch;
}

.f2s-tmpl-report {
  display: flex;
  flex-direction: column;
  gap: 24px;
  width: 100%;
}

.f2s-tmpl-preview {
  align-self: stretch;
  width: 100%;
  max-width: 100%;
}

.f2s-tmpl-panel {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.f2s-tmpl-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.f2s-tmpl-heading {
  margin: 0;
  font-size: 12px;
  font-weight: 700;
  color: var(--color-black-70);
}

.f2s-tmpl-section--blocking .f2s-tmpl-heading {
  color: var(--color-error);
}

/* Attentes de fin de parcours : ce que "template" veut dire côté Slides
   (présentation à dupliquer, pas un vrai master) — voir TemplatePanel.tsx. */
.f2s-tmpl-note {
  margin: 0;
  font-size: 12px;
  color: var(--color-black-70);
  max-width: 720px;
}

.f2s-tmpl-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.f2s-tmpl-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-width: 0;
  text-align: left;
  font-family: inherit;
  font-size: 12px;
  color: var(--color-text);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 6px;
  padding: 6px 10px;
}

.f2s-tmpl-chip:hover {
  border-color: var(--color-orange);
}

/* Rôle de placeholder en texte neutre (les anciens badges colorés
   title/subtitle=orange, image/logo=rouge ne portaient aucune sémantique
   lisible — décoration retirée, cf. audit). */
.f2s-tmpl-role {
  flex: none;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--color-black-70);
}

/* Le nom du calque tagué devient le label du placeholder (p.label) : sur un
   calque texte, ce nom par défaut est son contenu entier — tronqué sur une
   ligne plutôt que de casser sur plusieurs, le libellé complet reste dans
   `title` (cf. f2s-log-entry-name dans DeckPanel.tsx). */
.f2s-tmpl-chip-label {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.f2s-tmpl-font-family {
  font-weight: 700;
}

/* ---- Aside "Styles" : liste compacte façon Figma (Color/Text styles) ---- */

.f2s-style-panel {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.f2s-style-heading {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.f2s-style-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.f2s-style-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.f2s-style-row-main {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Le damier sous-jacent rend visible l'alpha d'une couleur détectée semi-transparente, plutôt que de la faire fondre dans le fond du panneau. */
.f2s-style-swatch {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1px solid var(--color-border);
  flex: none;
  background-image: linear-gradient(45deg, rgba(127, 127, 127, 0.25) 25%, transparent 25%, transparent 75%, rgba(127, 127, 127, 0.25) 75%),
    linear-gradient(45deg, rgba(127, 127, 127, 0.25) 25%, transparent 25%, transparent 75%, rgba(127, 127, 127, 0.25) 75%);
  background-size: 8px 8px;
  background-position: 0 0, 4px 4px;
  background-origin: border-box;
}

.f2s-style-label {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.f2s-style-role-select {
  flex: 1 1 auto;
  min-width: 0;
}

.f2s-style-font-swatch {
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.f2s-style-font-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

/* Rouge plein, distinct de la bordure de sélection active (orange-red).
   La bordure seule se remarquait mal quand la vignette est déjà bordée par
   du contenu clair/coloré au raz du cadre — un badge explicite en plus,
   lisible même en un coup d'œil sur tout le rail (audit template, TODO.md
   point "retour d'erreur sur une vignette bloquante"). */
.f2s-frame-preview--blocking {
  border-color: var(--color-error);
  position: relative;
}

.f2s-frame-preview--blocking::after {
  content: '!';
  position: absolute;
  top: 4px;
  right: 4px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--color-error);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  line-height: 16px;
  text-align: center;
  pointer-events: none;
}

/* ---- Barre de statut (login / progression / erreurs) ---- */

.f2s-statusbar {
  flex: none;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  padding: 12px 16px;
  background: var(--color-bg);
  border-top: 1px solid var(--color-border);
}

.f2s-progress {
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.f2s-spinner {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid var(--color-orange-40);
  border-top-color: var(--color-orange);
  animation: f2s-spin 0.8s linear infinite;
  flex: none;
}

/* Sur le bouton primaire (fond orange, cf. "Waiting for Google sign-in…"),
   le spinner orange sur orange devient invisible. On reprend --color-bg,
   déjà utilisé comme couleur du libellé de ce bouton (clair en thème clair,
   sombre en thème sombre — cf. :root et les overrides figma-dark/prefers-
   color-scheme) : le spinner reste ainsi assorti au texte dans les deux
   thèmes plutôt que blanc fixe, illisible en thème sombre. */
.f2s-btn--primary .f2s-spinner {
  border-color: color-mix(in srgb, var(--color-bg) 40%, transparent);
  border-top-color: var(--color-bg);
}

/* Spinner + libellé à l'intérieur d'un `.f2s-btn` (ex. "Sign in with
   Google" pendant les deux temps d'attente réseau) — un `<button>`/`<a>`
   ne peut pas être lui-même flex sans perturber son padding/alignement
   existant, ce wrapper interne s'en charge à la place. */
.f2s-btn-loading {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

@keyframes f2s-spin {
  to {
    transform: rotate(360deg);
  }
}

.f2s-error {
  color: var(--color-error);
  font-size: 12px;
  margin: 0;
}

.f2s-login {
  display: flex;
  align-items: center;
  gap: 16px;
}

/* ---- Footer (settings / support) ---- */

.f2s-footer {
  flex: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 16px;
  border-top: 1px solid var(--color-border);
  background: var(--color-bg);
  z-index: 50;
}

.f2s-footer-settings {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--color-black-70);
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: 8px;
  padding: 6px 10px;
  margin-left: -10px;
  transition: color 0.15s ease, background-color 0.15s ease, transform 0.15s ease;
}

.f2s-footer-settings:hover:not(:disabled),
.f2s-footer-settings[aria-expanded='true'] {
  color: var(--color-text);
  background: var(--color-surface-muted);
}

/* Transform translateY() uniquement en mode moderne/hybrid */
html:not(.f2s-skin--win95) .f2s-footer-settings:active:not(:disabled) {
  transform: translateY(0.5px);
}

/* Micro-interaction de l'icône settings (gear retenu, le slider comparé
   en parallèle a été retiré) — comme le translateY() ci-dessus,
   désactivée en win95 (esprit rétro, pas d'animation). */
html:not(.f2s-skin--win95) .f2s-icon-gear {
  transition: transform 0.45s cubic-bezier(0.34, 1.15, 0.64, 1);
}

/* 60° = un sixième de tour, l'esprit d'un décalage d'une dent pour un
   engrenage à 6 dents — mais ce tracé IBM est dessiné à la main, pas un
   hexagone mathématiquement régulier : un calque superposé à 0°/60°
   montre que les dents ne retombent pas exactement les unes sur les
   autres. À la taille réelle de l'icône (16px) ça ne se voit pas, mais
   ce n'est pas un alignement pixel-perfect. Rebond adouci (overshoot
   1.56 -> 1.15) et transition ralentie (0.35s -> 0.45s) : la version
   précédente rendait trop violente au hover. scale réduit (1.04 -> 1.02)
   pour rester discret. */
html:not(.f2s-skin--win95) .f2s-footer-settings:hover:not(:disabled) .f2s-icon-gear {
  transform: rotate(60deg) scale(1.02);
}

/* Continue le tour amorcé au hover (même sens, pas d'inversion) au lieu
   de s'arrêter pile à 60° — et compresse légèrement pour le ressenti
   d'enfoncement. Transition plus courte et sans rebond : l'appui doit
   être net, le rebond est réservé à l'arrivée en hover. */
html:not(.f2s-skin--win95) .f2s-footer-settings:active:not(:disabled) .f2s-icon-gear {
  transform: rotate(68deg) scale(0.95);
  transition-duration: 0.12s;
  transition-timing-function: ease-out;
}

.f2s-footer-actions {
  display: flex;
  align-items: center;
  gap: 16px;
}

/* Message d'export échoué (session expirée, 400 Slides API, backend
   injoignable…) : tronqué sur une ligne pour ne pas casser la mise en page
   fixe du footer — le message complet reste dans `title`. */
.f2s-footer-error {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---- Modale de réglages ---- */

:root {
  /* Aligné sur TRANSITION_MS (ui/SettingsModal.tsx), qui pilote le démontage
     du composant à la fin de l'animation de sortie. */
  --f2s-modal-duration: 220ms;
  --f2s-modal-ease: cubic-bezier(0.16, 1, 0.3, 1);
}

.f2s-modal-overlay {
  position: absolute;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(18, 15, 13, 0.45);
  /* État de DÉPART de l'ouverture (et d'arrivée de la fermeture) : `.is-open`
     est posée un frame après le montage pour que la transition ait deux états
     distincts à interpoler. */
  opacity: 0;
  transition: opacity var(--f2s-modal-duration) var(--f2s-modal-ease);
}

.f2s-modal-overlay.is-open {
  opacity: 1;
}

.f2s-modal {
  width: 100%;
  max-width: 480px;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: 12px;
  box-shadow: 0 12px 32px rgba(18, 15, 13, 0.18);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  opacity: 0;
  transform: translateY(8px) scale(0.98);
  transition: opacity var(--f2s-modal-duration) var(--f2s-modal-ease), transform var(--f2s-modal-duration) var(--f2s-modal-ease);
}

.f2s-modal:focus {
  outline: none;
}

.f2s-modal-overlay.is-open .f2s-modal {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* Figma n'expose pas de réglage "réduire les animations" à l'iframe : on suit
   la préférence système, la modale apparaît alors sans glissement. */
@media (prefers-reduced-motion: reduce) {
  .f2s-modal-overlay,
  .f2s-modal {
    transition-duration: 0.01ms;
  }

  .f2s-modal {
    transform: none;
  }
}

.f2s-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px;
  border-bottom: 1px solid var(--color-border);
}

.f2s-modal-title {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
}

.f2s-modal-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.f2s-setting {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.f2s-setting-text {
  min-width: 0;
}

.f2s-setting-title {
  margin: 0;
  font-size: 12px;
  font-weight: 700;
}

.f2s-setting-desc {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--color-black-70);
}

/* ---- Tab menu (segmented control) ---- */

.f2s-tabs {
  display: inline-flex;
  flex: none;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--color-border);
  background: var(--color-surface-muted);
  border-radius: 8px;
}

.f2s-tab {
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  color: var(--color-black-70);
  background: transparent;
  border: none;
  border-radius: 6px;
  padding: 5px 14px;
  transition: background-color 0.15s ease, color 0.15s ease;
}

.f2s-tab:hover:not(.is-active) {
  color: var(--color-text);
}

.f2s-tab.is-active {
  background: var(--color-bg);
  color: var(--color-text);
  box-shadow: 0 1px 2px rgba(18, 15, 13, 0.16);
}

/* ---- Aperçu d'export "Windows 95" ----
   Pendant un export, le grand aperçu du deck montre la frame dont le lot est
   en cours d'application côté backend, en la "générant" bande par bande
   (voir ui/RetroExportPreview.tsx). Les couleurs de cette fenêtre sont
   volontairement figées (ni thème clair ni thème sombre) : c'est une
   citation littérale du chrome 95, gris #c0c0c0 et biseaux 1 px compris. */

.f2s-retro {
  --w95-face: #c0c0c0;
  --w95-light: #ffffff;
  --w95-shadow: #808080;
  --w95-dark: #000000;
  --w95-title: #000080;
  --w95-title-fade: #1084d0;

  flex: none;
  width: 100%;
  max-width: 640px;
  padding: 3px;
  background: var(--w95-face);
  color: #000000;
  font-family: Tahoma, Verdana, "MS Sans Serif", Geneva, sans-serif;
  font-size: 11px;
  /* Biseau sortant : clair en haut/gauche, deux niveaux d'ombre en bas/droite. */
  border-top: 1px solid var(--w95-light);
  border-left: 1px solid var(--w95-light);
  border-right: 1px solid var(--w95-dark);
  border-bottom: 1px solid var(--w95-dark);
  box-shadow: inset -1px -1px 0 var(--w95-shadow);
}

.f2s-retro-titlebar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 2px 2px 2px 4px;
  background: linear-gradient(90deg, var(--w95-title), var(--w95-title-fade));
  color: #ffffff;
  font-weight: 700;
}

.f2s-retro-title {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.f2s-retro-window-buttons {
  display: flex;
  gap: 2px;
  flex: none;
}

.f2s-retro-window-buttons i {
  width: 16px;
  height: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-style: normal;
  font-size: 9px;
  line-height: 1;
  color: #000000;
  background: var(--w95-face);
  border-top: 1px solid var(--w95-light);
  border-left: 1px solid var(--w95-light);
  border-right: 1px solid var(--w95-dark);
  border-bottom: 1px solid var(--w95-dark);
}

/* Biseau rentrant : l'écran est "enfoncé" dans la fenêtre. */
.f2s-retro-screen {
  position: relative;
  margin-top: 3px;
  overflow: hidden;
  background: #008080;
  border-top: 1px solid var(--w95-shadow);
  border-left: 1px solid var(--w95-shadow);
  border-right: 1px solid var(--w95-light);
  border-bottom: 1px solid var(--w95-light);
}

.f2s-retro-canvas {
  display: block;
  width: 100%;
  height: auto;
  /* Le tramage VGA de la passe grossière ne survivrait pas à un lissage. */
  image-rendering: pixelated;
}

.f2s-retro-noise {
  padding: 48px 0;
  text-align: center;
  color: #00ff00;
  letter-spacing: 2px;
}

.f2s-retro-scanlines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0, 0, 0, 0.16) 0,
    rgba(0, 0, 0, 0.16) 1px,
    transparent 1px,
    transparent 3px
  );
}

/* Ligne de balayage : là où l'image est en train d'être "générée". */
.f2s-retro-beam {
  position: absolute;
  left: 0;
  right: 0;
  height: 2px;
  pointer-events: none;
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 0 6px rgba(255, 255, 255, 0.7);
}

.f2s-retro-status {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  padding: 3px 4px;
  border-top: 1px solid var(--w95-shadow);
  border-left: 1px solid var(--w95-shadow);
  border-right: 1px solid var(--w95-light);
  border-bottom: 1px solid var(--w95-light);
}

.f2s-retro-status-text {
  flex: none;
  white-space: nowrap;
}

.f2s-retro-ellipsis {
  animation: f2s-retro-blink 1s steps(1, end) infinite;
}

@keyframes f2s-retro-blink {
  50% {
    opacity: 0;
  }
}

.f2s-retro-bar {
  flex: 1;
  min-width: 0;
  height: 14px;
  padding: 1px;
  background: var(--w95-face);
  border-top: 1px solid var(--w95-shadow);
  border-left: 1px solid var(--w95-shadow);
  border-right: 1px solid var(--w95-light);
  border-bottom: 1px solid var(--w95-light);
}

/* Les blocs bleus caractéristiques : un dégradé à paliers durs, découpé par
   la largeur du remplissage — pas de bloc à moitié peint. */
.f2s-retro-bar-fill {
  height: 100%;
  background: repeating-linear-gradient(
    to right,
    var(--w95-title) 0,
    var(--w95-title) 8px,
    transparent 8px,
    transparent 10px
  );
  transition: width 120ms linear;
}

/* Vignette du rail correspondant à la frame en cours d'export. */
.f2s-frame-preview.is-exporting {
  border-color: var(--color-orange);
  animation: f2s-exporting-pulse 1.1s ease-in-out infinite;
}

@keyframes f2s-exporting-pulse {
  50% {
    border-color: var(--color-orange-40);
  }
}

/* ============================================================================
   Skin Windows 95 (skin PAR DÉFAUT — voir ui/types.ts).

   Cette feuille ne redéfinit AUCUNE structure : la mise en page (flex,
   tailles, colonnes) reste celle de styles.css, seul l'habillage est
   repeint. Toutes les règles sont scopées sous `html.f2s-skin--win95` —
   posé sur <html> par ui.tsx — et ce fichier est concaténé APRÈS
   styles.css (esbuild.config.mjs), donc il l'emporte y compris sur les
   blocs de thème sombre `html.figma-dark` / `prefers-color-scheme` qui ont
   la même spécificité.

   Le skin est volontairement mono-thème : Windows 95, c'est ce gris-là. Il
   ignore donc le thème clair/sombre de Figma, contrairement au skin
   moderne.
   ============================================================================ */

html.f2s-skin--win95 {
  /* Palette système 16 couleurs. */
  --w95-face: #c0c0c0;
  --w95-shadow: #808080;
  --w95-dark: #0a0a0a;
  --w95-light: #dfdfdf;
  --w95-white: #ffffff;
  --w95-navy: #000080;
  --w95-navy-light: #1084d0;

  /* Les trois biseaux du chrome 95, en ombres internes empilées : deux
     pixels de relief (clair/foncé) sur chaque bord. `out` = bouton au
     repos, `in` = champ ou zone creusée, `pressed` = bouton enfoncé. */
  --w95-out: inset -1px -1px var(--w95-dark), inset 1px 1px var(--w95-white), inset -2px -2px var(--w95-shadow),
    inset 2px 2px var(--w95-light);
  --w95-in: inset -1px -1px var(--w95-white), inset 1px 1px var(--w95-shadow), inset -2px -2px var(--w95-light),
    inset 2px 2px var(--w95-dark);
  --w95-pressed: inset -1px -1px var(--w95-white), inset 1px 1px var(--w95-dark), inset -2px -2px var(--w95-light),
    inset 2px 2px var(--w95-shadow);
  /* Cadre "gravé" 1px des group boxes (Logs, sections du rapport). */
  --w95-etched: inset -1px -1px var(--w95-white), inset 1px 1px var(--w95-shadow);

  /* Remappage des tokens du design system : tout ce qui n'est pas repeint
     explicitement plus bas reste cohérent avec la palette système. L'accent
     de marque (orange) devient le bleu de sélection Windows. */
  --color-bg: var(--w95-face);
  --color-text: #000000;
  --color-black-70: #3f3f3f;
  --color-scrollbar: var(--w95-face);
  --color-gray-light: var(--w95-light);
  --color-border: var(--w95-shadow);
  --color-surface: var(--w95-white);
  --color-surface-muted: var(--w95-face);
  --color-orange: var(--w95-navy);
  --color-orange-40: var(--w95-navy-light);
  --color-orange-red: var(--w95-navy);
  --color-error: #a80000;
}

html.f2s-skin--win95 body {
  /* Pas de webfont pixel disponible hors ligne (le HTML du plugin est une
     chaîne autonome, cf. esbuild.config.mjs) : Tahoma est la police système
     la plus proche de MS Sans Serif, présente partout. */
  font-family: Tahoma, 'MS Sans Serif', Geneva, Verdana, sans-serif;
  font-size: 11px;
  font-weight: 400;
  color: #000;
  background: var(--w95-face);
}

/* Le panneau entier devient LA fenêtre : cadre en relief autour de tout.
   Le padding-bottom (57px en base, pour son footer plus haut) doit rester
   réservé au footer, plus court ici (~35px) mais toujours `position: fixed` :
   sans son propre padding-bottom, le raccourci `padding: 3px` l'écrasait à
   3px et le footer chevauchait le bas du canvas (rail + logs), masquant la
   fin de la liste de logs même une fois le scroll interne remonté au max. */
html.f2s-skin--win95 #app {
  padding: 3px 3px 38px;
  background: var(--w95-face);
  box-shadow: var(--w95-out);
}

html.f2s-skin--win95 a {
  color: var(--w95-navy);
}

/* ---- Barre de titre (rendue par ui.tsx uniquement dans ce skin) ---- */

.f2s-titlebar {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  height: 20px;
  padding: 0 2px 0 4px;
  margin-bottom: 3px;
  background: linear-gradient(90deg, var(--w95-navy), var(--w95-navy-light));
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  user-select: none;
}

.f2s-titlebar-text {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* Seule case de la barre de titre à avoir un équivalent réel côté Figma
   (`figma.closePlugin()`) — pas de réduire/agrandir pour une iframe de
   plugin, donc pas de bouton décoratif qui ne ferait rien. */
.f2s-titlebar-btn {
  flex: none;
  width: 16px;
  height: 14px;
  padding: 0;
  border: none;
  background: var(--w95-face);
  color: #000;
  box-shadow: var(--w95-out);
  font-family: inherit;
  font-size: 9px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.f2s-titlebar-btn:active {
  box-shadow: var(--w95-pressed);
}

/* ---- Barres (topbar / toolbar / footer) ---- */

html.f2s-skin--win95 .f2s-topbar {
  padding: 6px 6px 0;
  gap: 8px;
}

html.f2s-skin--win95 .f2s-topbar-left,
html.f2s-skin--win95 .f2s-topbar-actions,
html.f2s-skin--win95 .f2s-footer-actions {
  gap: 6px;
}

/* Le logo prend la même hauteur que le bouton ".f2s-btn--secondary" juste
   à côté de lui en win95 (11px + padding 4px/4px + bordure 1px/1px = 22px,
   mesuré en rendu réel). Un align-items:stretch + aspect-ratio:1/1 aurait
   évité de recopier cette valeur à la main, mais casse ici : le SVG du
   logo est dimensionné en width/height 100% (styles.css), donc sans
   hauteur explicite sur .f2s-logo le stretch n'a rien à partir de quoi se
   calculer (dépendance circulaire) et le logo explose à la taille de
   remplacement par défaut (300×300) — vérifié en rendu. Valeur fixe donc,
   à réajuster si le gabarit du bouton change. */
html.f2s-skin--win95 .f2s-logo {
  width: 22px;
  height: 22px;
}

html.f2s-skin--win95 .f2s-toolbar {
  gap: 8px;
  padding: 6px;
}

html.f2s-skin--win95 .f2s-toolbar-row {
  gap: 16px;
}

html.f2s-skin--win95 .f2s-toolbar-label {
  font-weight: 400;
  color: #000;
}

html.f2s-skin--win95 .f2s-toolbar-muted,
html.f2s-skin--win95 .f2s-frame-text,
html.f2s-skin--win95 .f2s-frame-index,
html.f2s-skin--win95 .f2s-frame-name-input,
html.f2s-skin--win95 .f2s-dim-unit,
html.f2s-skin--win95 .f2s-dim-sep,
html.f2s-skin--win95 .f2s-font-original,
html.f2s-skin--win95 .f2s-font-arrow,
html.f2s-skin--win95 .f2s-empty,
html.f2s-skin--win95 .f2s-canvas-empty,
html.f2s-skin--win95 .f2s-tmpl-note {
  color: #000;
}

html.f2s-skin--win95 .f2s-footer {
  padding: 6px;
  /* Séparateur gravé classique : ligne foncée puis ligne claire. */
  border-top: 1px solid var(--w95-shadow);
  box-shadow: inset 0 1px 0 var(--w95-white);
  background: var(--w95-face);
}

html.f2s-skin--win95 .f2s-body {
  border-top: 1px solid var(--w95-shadow);
  box-shadow: inset 0 1px 0 var(--w95-white);
}

/* ---- Boutons ----
   Un bouton 95 : face grise, biseau en relief, texte au ras. Le bouton par
   défaut porte en plus un liseré noir 1px À L'EXTÉRIEUR du biseau — d'où la
   bordure transparente de même épaisseur sur tous les autres, qui garde les
   hauteurs alignées. */

html.f2s-skin--win95 .f2s-btn {
  font-size: 11px;
  font-weight: 400;
  border: 1px solid transparent;
  background-clip: padding-box;
  border-radius: 0;
  padding: 4px 12px;
  min-width: 72px;
  background-color: var(--w95-face);
  color: #000;
  box-shadow: var(--w95-out);
  outline: none;
  transition: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* Un bouton 95 ne réagit pas au survol — seul l'enfoncement le fait. Les
   trois variantes du design system convergent donc vers le même rendu. */
html.f2s-skin--win95 .f2s-btn--primary:hover:not(:disabled),
html.f2s-skin--win95 .f2s-btn--secondary:hover:not(:disabled),
html.f2s-skin--win95 .f2s-btn--tertiary:hover:not(:disabled) {
  background-color: var(--w95-face);
  color: #000;
  box-shadow: var(--w95-out);
  outline-color: transparent;
}

/* L'enfoncement décale le libellé d'un pixel vers le bas/droite. */
html.f2s-skin--win95 .f2s-btn:active:not(:disabled) {
  box-shadow: var(--w95-pressed);
  padding: 5px 11px 3px 13px;
}

html.f2s-skin--win95 .f2s-btn--primary {
  border-color: var(--w95-dark);
  font-weight: 700;
}

/* Grisé 95 : le libellé est gravé (gris + rehaut blanc), pas atténué en
   opacité — un bouton désactivé garde son relief. */
html.f2s-skin--win95 .f2s-btn:disabled {
  opacity: 1;
  color: var(--w95-shadow);
  text-shadow: 1px 1px 0 var(--w95-white);
}

/* ---- Champs (saisie, listes déroulantes, boîtes de dimensions) ---- */

html.f2s-skin--win95 .f2s-title-input,
html.f2s-skin--win95 .f2s-font-dropdown,
html.f2s-skin--win95 .f2s-dim-box {
  font-size: 11px;
  border: none;
  border-radius: 0;
  background: var(--w95-white);
  color: #000;
  box-shadow: var(--w95-in);
  padding: 3px 6px;
}

html.f2s-skin--win95 .f2s-title-input:focus,
html.f2s-skin--win95 .f2s-font-dropdown:focus {
  outline: none;
  box-shadow: var(--w95-in);
}

html.f2s-skin--win95 .f2s-title-input::placeholder {
  color: var(--w95-shadow);
  opacity: 1;
}

html.f2s-skin--win95 .f2s-frame-info:hover .f2s-frame-name-input,
html.f2s-skin--win95 .f2s-frame-name-input:focus {
  border-radius: 0;
  background: var(--w95-white);
  box-shadow: var(--w95-in);
}

/* ---- Rail de vignettes + zone principale : deux zones creusées ---- */

html.f2s-skin--win95 .f2s-sidebar {
  padding: 6px;
  gap: 10px;
  border-right: 1px solid var(--w95-shadow);
  box-shadow: inset -1px 0 0 var(--w95-white);
}

html.f2s-skin--win95 .f2s-style-aside {
  padding: 8px;
  border-left: 1px solid var(--w95-shadow);
  box-shadow: inset 1px 0 0 var(--w95-white);
}

html.f2s-skin--win95 .f2s-canvas {
  padding: 12px;
  gap: 12px;
}

/* La vignette : puits creusé blanc, liseré de sélection bleu Windows. */
html.f2s-skin--win95 .f2s-frame-preview {
  border: 2px solid var(--w95-face);
  border-radius: 0;
  background: var(--w95-white);
  box-shadow: var(--w95-in);
}

html.f2s-skin--win95 .f2s-frame-preview:hover:not(.is-active) {
  border-color: var(--w95-shadow);
}

html.f2s-skin--win95 .f2s-frame-preview.is-active {
  border-color: var(--w95-navy);
}

html.f2s-skin--win95 .f2s-frame-preview--blocking {
  border-color: var(--color-error);
}

/* Badge carré (pas de coin arrondi en Windows 95) — même principe que le
   skin moderne (styles.css), juste la géométrie qui change. */
html.f2s-skin--win95 .f2s-frame-preview--blocking::after {
  border-radius: 0;
  box-shadow: var(--w95-out);
}

html.f2s-skin--win95 .f2s-canvas-preview {
  border: none;
  background: var(--w95-white);
  box-shadow: var(--w95-in);
  padding: 2px;
}

/* Petit bouton carré à biseau (croix de suppression). */
html.f2s-skin--win95 .f2s-icon-btn {
  width: 16px;
  height: 16px;
  border-radius: 0;
  font-size: 9px;
  background: var(--w95-face);
  color: #000;
  box-shadow: var(--w95-out);
}

html.f2s-skin--win95 .f2s-icon-btn:hover:not(:disabled) {
  background: var(--w95-face);
}

html.f2s-skin--win95 .f2s-icon-btn:active:not(:disabled) {
  box-shadow: var(--w95-pressed);
}

/* ---- Group boxes : Logs et sections du rapport de template ---- */

html.f2s-skin--win95 .f2s-logs,
html.f2s-skin--win95 .f2s-tmpl-section {
  border: none;
  border-radius: 0;
  background: var(--w95-face);
  box-shadow: var(--w95-etched);
  padding: 10px;
}

html.f2s-skin--win95 .f2s-tmpl-heading {
  font-weight: 700;
  color: #000;
}

html.f2s-skin--win95 .f2s-tmpl-section--blocking .f2s-tmpl-heading {
  color: var(--color-error);
}

/* Entrées de liste cliquables : boutons à biseau, pas des puces à bord
   arrondi qui changent de couleur au survol. */
html.f2s-skin--win95 .f2s-log-entry,
html.f2s-skin--win95 .f2s-tmpl-chip {
  font-size: 11px;
  border: none;
  border-radius: 0;
  background: var(--w95-face);
  color: #000;
  box-shadow: var(--w95-out);
  padding: 4px 8px;
}

html.f2s-skin--win95 .f2s-log-entry:hover,
html.f2s-skin--win95 .f2s-tmpl-chip:hover {
  border-color: transparent;
}

html.f2s-skin--win95 .f2s-log-entry:active,
html.f2s-skin--win95 .f2s-tmpl-chip:active {
  box-shadow: var(--w95-pressed);
}

html.f2s-skin--win95 .f2s-log-entry--blocking {
  color: var(--color-error);
}

html.f2s-skin--win95 .f2s-log-entry-flag {
  border-radius: 0;
}

html.f2s-skin--win95 .f2s-tmpl-role {
  color: #000;
}

/* ---- Progression / erreurs ---- */

html.f2s-skin--win95 .f2s-spinner {
  border-radius: 0;
  border-color: var(--w95-shadow);
  border-top-color: var(--w95-navy);
}

html.f2s-skin--win95 .f2s-error {
  color: var(--color-error);
}

html.f2s-skin--win95 .f2s-toast {
  border: none;
  border-radius: 0;
  background: var(--w95-face);
  box-shadow: var(--w95-out);
}

/* ---- Modale de réglages (habillage + thème) ----
   Une boîte de dialogue 95 : cadre en relief, barre de titre en dégradé,
   pas d'ombre portée ni de coins arrondis. L'animation d'ouverture reste
   celle du skin moderne — elle ne dépend d'aucune couleur. */

html.f2s-skin--win95 .f2s-modal-overlay {
  background: rgba(0, 0, 0, 0.35);
}

html.f2s-skin--win95 .f2s-modal {
  border: none;
  border-radius: 0;
  background: var(--w95-face);
  box-shadow: var(--w95-out);
  padding: 3px;
  max-width: 380px;
}

/* L'en-tête DEVIENT la barre de titre de la boîte de dialogue. */
html.f2s-skin--win95 .f2s-modal-header {
  height: 20px;
  padding: 0 2px 0 4px;
  border-bottom: none;
  background: linear-gradient(90deg, var(--w95-navy), var(--w95-navy-light));
  color: #fff;
}

html.f2s-skin--win95 .f2s-modal-title {
  font-size: 11px;
  font-weight: 700;
}

/* La croix de fermeture est ici une case de barre de titre, pas le petit
   bouton plat du rail de vignettes. */
html.f2s-skin--win95 .f2s-modal-header .f2s-icon-btn {
  width: 16px;
  height: 14px;
}

html.f2s-skin--win95 .f2s-modal-body {
  padding: 12px 10px;
  gap: 14px;
}

html.f2s-skin--win95 .f2s-setting-title {
  font-weight: 700;
  color: #000;
}

html.f2s-skin--win95 .f2s-setting-desc {
  font-size: 11px;
  color: #000;
}

/* ---- Tab menus des réglages : boutons bascule, l'option active enfoncée ---- */

html.f2s-skin--win95 .f2s-tabs {
  border: none;
  border-radius: 0;
  background: transparent;
  padding: 0;
  gap: 3px;
}

html.f2s-skin--win95 .f2s-tab {
  font-size: 11px;
  font-weight: 400;
  border-radius: 0;
  padding: 3px 10px;
  background-color: var(--w95-face);
  color: #000;
  box-shadow: var(--w95-out);
  transition: none;
}

html.f2s-skin--win95 .f2s-tab:hover:not(.is-active) {
  color: #000;
}

/* Bascule enfoncée : creusé + trame de fond, comme un bouton de barre
   d'outils Windows resté actif. */
html.f2s-skin--win95 .f2s-tab.is-active {
  background-color: var(--w95-face);
  color: #000;
  box-shadow: var(--w95-pressed);
  background-image: linear-gradient(45deg, var(--w95-white) 25%, transparent 25%, transparent 75%, var(--w95-white) 75%),
    linear-gradient(45deg, var(--w95-white) 25%, transparent 25%, transparent 75%, var(--w95-white) 75%);
  background-size: 2px 2px;
  background-position: 0 0, 1px 1px;
}

/* Grisé 95 : libellé gravé, relief conservé — le tab menu du thème est
   désactivé sous ce skin (palette unique, cf. SettingsModal.tsx). */
html.f2s-skin--win95 .f2s-tab:disabled {
  opacity: 1;
  color: var(--w95-shadow);
  text-shadow: 1px 1px 0 var(--w95-white);
}

/* ---- Bouton "Settings" du footer ---- */

html.f2s-skin--win95 .f2s-footer-settings {
  font-weight: 400;
  color: #000;
  gap: 6px;
  border: none;
  border-radius: 0;
  margin-left: 0;
  padding: 3px 8px;
  background: var(--w95-face);
  box-shadow: var(--w95-out);
  transition: none;
}

html.f2s-skin--win95 .f2s-footer-settings:hover {
  color: #000;
}

html.f2s-skin--win95 .f2s-footer-settings[aria-expanded='true'] {
  color: #000;
  box-shadow: var(--w95-pressed);
}

/* ---- Ascenseurs ---- */

html.f2s-skin--win95 ::-webkit-scrollbar {
  width: 16px;
  height: 16px;
}

/* Piste tramée 1px blanc/gris — le motif emblématique. */
html.f2s-skin--win95 ::-webkit-scrollbar-track {
  background-color: var(--w95-face);
  background-image: linear-gradient(45deg, var(--w95-white) 25%, transparent 25%, transparent 75%, var(--w95-white) 75%),

  background-size: 2px 2px;
  background-position: 0 0, 1px 1px;
}

html.f2s-skin--win95 ::-webkit-scrollbar-thumb {
  background: var(--w95-face);
  border-radius: 0;
  box-shadow: var(--w95-out);
}

html.f2s-skin--win95 ::-webkit-scrollbar-button {
  background: var(--w95-face);
  box-shadow: var(--w95-out);
  height: 16px;
  width: 16px;
}

html.f2s-skin--win95 * {
  scrollbar-color: var(--w95-face) var(--w95-light);
  scrollbar-width: auto;
}

/* Le menu déroulant natif n'a pas la place d'un ascenseur de 16px. */
html.f2s-skin--win95 .f2s-font-dropdown::-webkit-scrollbar {
  width: 16px;
  height: 16px;
}

   (--color-orange, --color-bg, etc.) : ce skin reste la palette de marque

/* ---- Boutons ---- */

html.f2s-skin--hybrid .f2s-btn {
  border-radius: 0;
  box-shadow: var(--hyb-out);
}

html.f2s-skin--hybrid .f2s-btn:active:not(:disabled) {

  border-radius: 0;

html.f2s-skin--hybrid .f2s-title-input:focus,
html.f2s-skin--hybrid .f2s-font-dropdown:focus {

html.f2s-skin--hybrid .f2s-frame-preview {
  border-radius: 0;
  box-shadow: var(--hyb-in);

/* Badge carré (angles droits), cohérent avec le reste du skin. */

  border-radius: 0;
}

/* ---- Petit bouton carré (croix de suppression) : chrome seulement au

  border-radius: 0;
}

html.f2s-skin--hybrid .f2s-icon-btn:hover:not(:disabled) {
  box-shadow: var(--hyb-out);
}

html.f2s-skin--hybrid .f2s-icon-btn:active:not(:disabled) {
  box-shadow: var(--hyb-pressed);
}

html.f2s-skin--hybrid .f2s-logs,
html.f2s-skin--hybrid .f2s-tmpl-section {
  border: none;
  border-radius: 0;
  box-shadow: var(--hyb-etched);
}

/* Entrées de liste cliquables : biseau sortant/enfoncé plutôt que puces
   arrondies, l'accent orange au survol reste celui du skin moderne. */
html.f2s-skin--hybrid .f2s-log-entry,
html.f2s-skin--hybrid .f2s-tmpl-chip {
  border-radius: 0;
  border-color: transparent;
  box-shadow: var(--hyb-out);
}

html.f2s-skin--hybrid .f2s-log-entry:active,
html.f2s-skin--hybrid .f2s-tmpl-chip:active {
  box-shadow: var(--hyb-pressed);
}

html.f2s-skin--hybrid .f2s-log-entry--blocking {
  border-color: transparent;
}

html.f2s-skin--hybrid .f2s-log-entry-flag {
  border-radius: 0;
}

/* ---- Modale de réglages ----

html.f2s-skin--hybrid .f2s-modal {
  border: none;
  border-radius: 0;
  box-shadow: var(--hyb-out), 0 16px 40px rgba(18, 15, 13, 0.25);
}

html.f2s-skin--hybrid .f2s-toast {
  border: none;
  border-radius: 0;
  box-shadow: var(--hyb-out), 0 8px 20px rgba(18, 15, 13, 0.18);
}

/* ---- Tab menus des réglages : segmented control aux angles droits, l'onglet
   actif enfoncé — sans la trame tramée, exclusive au skin win95. ---- */

html.f2s-skin--hybrid .f2s-tabs {
  border-radius: 0;
}

html.f2s-skin--hybrid .f2s-tab {
  border-radius: 0;
}

html.f2s-skin--hybrid .f2s-tab.is-active {
  box-shadow: var(--hyb-pressed);
}

/* ---- Bouton "Settings" du footer ---- */

html.f2s-skin--hybrid .f2s-footer-settings {
  border-radius: 0;
}

html.f2s-skin--hybrid .f2s-footer-settings:hover {
  box-shadow: var(--hyb-out);
  border-color: transparent;
}

html.f2s-skin--hybrid .f2s-footer-settings[aria-expanded='true'] {
  box-shadow: var(--hyb-pressed);
